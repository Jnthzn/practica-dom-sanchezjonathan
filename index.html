<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galería de Superheroes</title>

    <link rel="stylesheet" href="assets/css/styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- encabezado -->
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand mb-0 h1">Galería de Superheroes</span>
      </div>
    </nav>
    <!-- contenido -->
    <main class="container my-4">
      <section class="mb-4">
        <h2 class="mb-3">Buscar Personaje</h2>

        <div class="input-group">
          <input
            type="text"
            name="filtro"
            id="filtro"
            class="form-control"
            placeholder="Ingrese un nombre"
          />

          <button type="button" id="btnFiltrar" class="btn btn-primary">
            Buscar
          </button>
        </div>
      </section>

      <section class="mb-5">
        <h2 class="mb-3">Agregar Personaje</h2>

        <form id="formPersonaje">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" id="nombre" class="form-control" required />
          </div>

          <div class="mb-3">
            <label for="imagen" class="form-label">URL de la imagen</label>
            <input
              type="url"
              name="imagen"
              id="imagen"
              class="form-control"
              required
            />
          </div>

          <button type="submit" class="btn btn-success">Agregar</button>
        </form>
      </section>

      <!-- contenedor -->
      <section>
        <h2 class="mb-3">Personajes</h2>

        <div id="contenedorPersonajes" class="row g-4"></div>
      </section>
    </main>

    <footer class="bg-dark text-light text-center py-3 mt-5">
      <p class="mb-0">
        &copy; 2026 - Galería de Superhéroes. Todos los derechos reservados.
      </p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
